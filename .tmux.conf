#### ─────────────────────────────────────────────
#### Basic Settings
#### ─────────────────────────────────────────────

# Use Ctrl-a as prefix instead of Ctrl-b
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Reload config quickly (prefix + r)
unbind r
bind r source-file ~/.tmux.conf \; display-message "✅ tmux.conf reloaded!"

# Enable truecolor support
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

# Mouse support
set -g mouse on

# Vim-style copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

#### ─────────────────────────────────────────────
#### Window & Pane Management
#### ─────────────────────────────────────────────

# Splits
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Resize panes with hjkl (hold prefix)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z  # toggle zoom

# Move between panes with hjkl
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

#### ─────────────────────────────────────────────
#### Quick Window Switching (Alt + number)
#### ─────────────────────────────────────────────


bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

#### ─────────────────────────────────────────────
#### Plugins via TPM
#### ─────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

#### ─────────────────────────────
#### Ultra Clean Status Bar
#### ─────────────────────────────

# Soporte RGB / Truecolor
set -as terminal-features ',xterm-256color:RGB'
set -ga terminal-overrides ',xterm-256color:Tc'

# Status bar
set -g status on
set -g status-interval 5
set -g status-justify centre

# Fondo negro sólido y texto gris claro
set -g status-bg black
set -g status-fg "#cccccc"

# Left / right layout
set -g status-left-length 30
set -g status-right-length 60

# Left: session name
set -g status-left "#[fg=#89b4fa,bold] #S #[default]"

# Center: window list
setw -g window-status-format " #[fg=#7f849c]#I:#W "
setw -g window-status-current-format "#[fg=#f9e2af,bold]#I:#W#[default]"

# Right: time + date
set -g status-right "#[fg=#a6e3a1] %H:%M #[fg=#585b70]•#[fg=#fab387] %Y-%m-%d "

# Pane borders
set -g pane-border-style fg=#3a3a3a
set -g pane-active-border-style fg=#89b4fa

# Messages / command line
set -g message-style bg=black,fg=#cdd6f4
set -g message-command-style bg=black,fg=#cdd6f4

# Reload shortcut (prefix + r)
bind r source-file ~/.tmux.conf \; display-message "✅ Config reloaded!"

# Initialize TPM (keep this at the end)
run '~/.tmux/plugins/tpm/tpm'

